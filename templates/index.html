<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>

<div class="container">

<div class="logo">
🤖 LIAMSI AI BOT
</div>

<div class="subtitle">
Professional AI Trading Signals
</div>

</header>

<div class="top-card">

</div>

<div class="card">
<h3>EMA</h3>

</div>

<div class="card">

<div class="card">

<p>125</p>
</div>

</div>
