<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIAMSI AI BOT</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>
🤖 LIAMSI AI BOT
</h1>

<p>
Professional AI Trading Signals
</p>

</div>

<div class="controls">

<select id="pair">

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CAD</option>
<option>AUD/USD</option>
<option>NZD/USD</option>
<option>EUR/JPY</option>
<option>CAD/JPY</option>
<option>BTC/USD</option>
<option>ETH/USD</option>

</select>

<select id="timeframe">

<option>M1</option>
<option>M5</option>
<option>M15</option>
<option>M30</option>
<option>H1</option>
<option>H4</option>

</select>

<button onclick="analyze()">

<i class="fa-solid fa-bolt"></i>

Analyze

</button>

</div>

<div class="signal-box">

<h2 id="pair_name">

EUR/USD | M1

</h2>

<div id="signal" class="buy">

BUY

</div>

<h1 id="confidence">

95%

</h1>

<p id="trend">

STRONG BULLISH

</p>

</div>

<div class="cards">

<div class="card">

<h3>Price</h3>

<h2 id="price">0.00000</h2>

</div>

<div class="card">

<h3>EMA</h3>

<h2 id="ema">0.00000</h2>

</div>

<div class="card">

<h3>RSI</h3>

<h2 id="rsi">0</h2>

</div>

<div class="card">

<h3>MACD</h3>

<h2 id="macd">0</h2>

</div>

<div class="card">

<h3>ADX</h3>

<h2 id="adx">0</h2>

</div>

<div class="card">

<h3>CCI</h3>

<h2 id="cci">0</h2>

</div>

<div class="card">

<h3>Support</h3>

<h2 id="support">0</h2>

</div>

<div class="card">

<h3>Resistance</h3>

<h2 id="resistance">0</h2>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
