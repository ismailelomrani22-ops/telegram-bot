<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIAMSI AI BOT</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<h1 class="logo">
🤖 LIAMSI AI BOT
</h1>

<p class="subtitle">
Professional AI Trading Signals
</p>

<div class="controls">

<select id="pair">

<option value="EUR/USD">🇪🇺 EUR/USD</option>
<option value="GBP/USD">🇬🇧 GBP/USD</option>
<option value="USD/JPY">🇯🇵 USD/JPY</option>
<option value="EUR/JPY">🇪🇺🇯🇵 EUR/JPY</option>
<option value="GBP/JPY">🇬🇧🇯🇵 GBP/JPY</option>
<option value="AUD/USD">🇦🇺 AUD/USD</option>
<option value="NZD/USD">🇳🇿 NZD/USD</option>
<option value="USD/CAD">🇨🇦 USD/CAD</option>
<option value="USD/CHF">🇨🇭 USD/CHF</option>
<option value="EUR/GBP">🇪🇺🇬🇧 EUR/GBP</option>
<option value="AUD/JPY">🇦🇺🇯🇵 AUD/JPY</option>
<option value="CAD/JPY">🇨🇦🇯🇵 CAD/JPY</option>
<option value="CHF/JPY">🇨🇭🇯🇵 CHF/JPY</option>
<option value="EUR/AUD">🇪🇺🇦🇺 EUR/AUD</option>
<option value="GBP/AUD">🇬🇧🇦🇺 GBP/AUD</option>

<option value="XAU/USD">🥇 Gold (XAU/USD)</option>
<option value="XAG/USD">🥈 Silver (XAG/USD)</option>

<option value="BTC/USD">₿ Bitcoin</option>
<option value="ETH/USD">⟠ Ethereum</option>
<option value="SOL/USD">◎ Solana</option>

</select>

<select id="timeframe">

<option>M1</option>
<option>M5</option>
<option>M15</option>
<option>M30</option>
<option>H1</option>
<option>H4</option>

</select>

<button onclick="analyze()">

<i class="fa-solid fa-chart-line"></i>

Analyze

</button>

</div>

<div class="signal-panel">

<div class="circle">

<svg>

<circle cx="90" cy="90" r="75"></circle>

<circle
cx="90"
cy="90"
r="75"
id="progress">

</circle>

</svg>

<div class="percent">

<span id="confidence">

0%

</span>

</div>

</div>

<div class="signal-info">

<h2 id="pairName">

EUR/USD

</h2>

<h1 id="signal" class="wait">

WAIT

</h1>

<p id="trend">

Neutral

</p>

</div>

</div>

<div class="cards">

<div class="card">

<h3>Price</h3>

<p id="price">0.00000</p>

</div>

<div class="card">

<h3>EMA</h3>

<p id="ema">0.00000</p>

</div>

<div class="card">

<h3>RSI</h3>

<p id="rsi">0</p>

</div>

<div class="card">

<h3>MACD</h3>

<p id="macd">0</p>

</div>

<div class="card">

<h3>ADX</h3>

<p id="adx">0</p>

</div>

<div class="card">

<h3>CCI</h3>

<p id="cci">0</p>

</div>

<div class="card">

<h3>Support</h3>

<p id="support">0.00000</p>

</div>

<div class="card">

<h3>Resistance</h3>

<p id="resistance">0.00000</p>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
