<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIAMSI AI BOT</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<div class="logo">

<h1>🤖 LIAMSI AI BOT</h1>

<p>Professional AI Trading Signals</p>

</div>

<div class="panel">

<label>Market</label>

<select id="market">

<option>Forex</option>

<option>OTC</option>

</select>

<label>Currency Pair</label>

<select id="pair">

<select id="pair">
    <option>EUR/USD</option>
    <option>GBP/USD</option>
    <option>USD/JPY</option>
    <option>USD/CAD</option>
    <option>AUD/USD</option>
    <option>XAU/USD</option>

    <!-- OTC -->
    <option>EUR/USD OTC</option>
    <option>GBP/USD OTC</option>
    <option>USD/JPY OTC</option>
    <option>USD/CAD OTC</option>
    <option>AUD/USD OTC</option>
    <option>NZD/USD OTC</option>
    <option>EUR/JPY OTC</option>
    <option>EUR/GBP OTC</option>
    <option>GBP/JPY OTC</option>
    <option>XAU/USD OTC</option>
</select>

<label>Timeframe</label>

<select id="timeframe">
  <option value="S5">S5</option>
  <option value="S15">S15</option>
  <option value="S30">S30</option>
  <option value="M1" selected>M1</option>
  <option value="M5">M5</option>
  <option value="M15">M15</option>
  <option value="M30">M30</option>
  <option value="H1">H1</option>
</select>      

<button id="signalBtn">

⚡ GET SIGNAL

</button>

</div>

<div class="result">

<div class="signal-card">

<div class="signal-title">
        ACTIVE SIGNAL
</div>

<div class="pair" id="pairName">
        EUR/USD OTC
</div>

<div id="signal" class="signal buy">
        WAITING...
</div>

<div class="confidence">
        <span id="confidence">0%</span>
</div>

<div class="countdown">
        ⏳ Next Signal in
<span id="timer">00:45</span>
</div>

</div>

<h2>Market Analysis</h2>

</div>

<div class="grid">

<div class="box">

Price

<span id="price">--</span>

</div>

<div class="box">

EMA 9

<span id="ema9">--</span>

</div>

<div class="box">

EMA 21

<span id="ema21">--</span>

</div>

<div class="box">

RSI

<span id="rsi">--</span>

</div>

<div class="box">

MACD

<span id="macd">--</span>

</div>

<div class="box">

Support

<span id="support">--</span>

</div>

<div class="box">

Resistance

<span id="resistance">--</span>

</div>

<div class="box">

Trend

<span id="trend">--</span>

</div>

</div>

</div>

<a class="telegram"
href="https://t.me/liamsi_ai_bot"
target="_blank">
   🚀 OPEN TELEGRAM BOT
</a>

</a>

</div>

<script src="/static/script.js"></script>

</body>
</html>
