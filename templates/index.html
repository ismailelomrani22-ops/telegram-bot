<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIAMSI AI BOT</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<div class="logo">
<h1>🤖 LIAMSI AI BOT</h1>
<p>Professional AI Trading Signals</p>
</div>

<div class="panel">

<label>Market</label>

<select id="market">
    <option value="Forex">Forex</option>
    <option value="OTC">OTC</option>
</select>

<label>Currency Pair</label>

<select id="pair">
    <option value="EUR/USD">EUR/USD</option>
    <option value="GBP/USD">GBP/USD</option>
    <option value="USD/JPY">USD/JPY</option>
    <option value="USD/CAD">USD/CAD</option>
    <option value="AUD/USD">AUD/USD</option>
    <option value="NZD/USD">NZD/USD</option>
    <option value="EUR/JPY">EUR/JPY</option>
    <option value="EUR/GBP">EUR/GBP</option>
    <option value="GBP/JPY">GBP/JPY</option>
    <option value="XAU/USD">XAU/USD</option>

    <option value="EUR/USD OTC">EUR/USD OTC</option>
    <option value="GBP/USD OTC">GBP/USD OTC</option>
    <option value="USD/JPY OTC">USD/JPY OTC</option>
    <option value="USD/CAD OTC">USD/CAD OTC</option>
    <option value="AUD/USD OTC">AUD/USD OTC</option>
    <option value="NZD/USD OTC">NZD/USD OTC</option>
    <option value="EUR/JPY OTC">EUR/JPY OTC</option>
    <option value="EUR/GBP OTC">EUR/GBP OTC</option>
    <option value="GBP/JPY OTC">GBP/JPY OTC</option>
    <option value="XAU/USD OTC">XAU/USD OTC</option>
</select>

<label>Timeframe</label>

<select id="timeframe">
    <option value="M1">M1</option>
    <option value="M5">M5</option>
    <option value="M15">M15</option>
    <option value="M30">M30</option>
    <option value="H1">H1</option>
</select>

<button id="signalBtn">
⚡ GET SIGNAL
</button>

</div>

<div class="result">

<div class="signal-card">

<div class="signal-title">
ACTIVE SIGNAL
</div>

<div class="pair" id="pairName">
EUR/USD
</div>

<div id="signal" class="signal wait">
WAITING...
</div>

<div class="confidence">
<span id="confidence">0%</span>
</div>

<div class="countdown">
⏳ Next Signal in
<span id="timer">00:45</span>
</div>

</div>

<h2>Market Analysis</h2>

</div>

<div class="grid">

<div class="box">
Price
<span id="price">--</span>
</div>

<div class="box">
EMA 9
<span id="ema9">--</span>
</div>

<div class="box">
EMA 21
<span id="ema21">--</span>
</div>

<div class="box">
RSI
<span id="rsi">--</span>
</div>

<div class="box">
MACD
<span id="macd">--</span>
</div>

<div class="box">
Support
<span id="support">--</span>
</div>

<div class="box">
Resistance
<span id="resistance">--</span>
</div>

<div class="box">
Trend
<span id="trend">--</span>
</div>

</div>

<a class="telegram"
href="https://t.me/liamsi_ai_bot"
target="_blank">
🚀 OPEN TELEGRAM BOT
</a>

</div>

<script src="/static/script.js"></script>

</body>
</html>
