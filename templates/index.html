<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Bot</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>🤖 AI Trading Bot</h1>

    <div class="card">

        <label>Market</label>
        <select id="market">
            <option value="forex">Forex</option>
            <option value="otc">OTC</option>
        </select>

        <label>Currency Pair</label>
        <select id="pair">
            <option>EUR/USD</option>
            <option>GBP/USD</option>
            <option>USD/JPY</option>
            <option>AUD/USD</option>
            <option>USD/CAD</option>
        </select>

        <label>Timeframe</label>
        <select id="timeframe">
            <option>M1</option>
            <option>M5</option>
            <option>M15</option>
            <option>M30</option>
            <option>H1</option>
        </select>

        <button id="signalBtn">
            ⚡ Get Signal
        </button>

    </div>

    <div class="result">

        <h2>Analysis</h2>

        <div id="signal">---</div>

        <p>EMA 9 :
            <span id="ema9">--</span>
        </p>

        <p>EMA 21 :
            <span id="ema21">--</span>
        </p>

        <p>RSI :
            <span id="rsi">--</span>
        </p>

        <p>MACD :
            <span id="macd">--</span>
        </p>

        <p>Support :
            <span id="support">--</span>
        </p>

        <p>Resistance :
            <span id="resistance">--</span>
        </p>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
